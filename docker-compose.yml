version: '3.8'

services:
  ktex-app:
    build: .
    container_name: ktexstore
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
      - ktex-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./dist:/app/dist:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
